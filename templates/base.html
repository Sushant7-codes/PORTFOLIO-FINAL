{% load static tailwind_tags %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sushant Pahari — Developer{% endblock %}</title>
    <meta name="description" content="Sushant Pahari — Full-stack developer focused on Django and Python. Based in Pokhara, Nepal.">
    <meta property="og:title" content="Sushant Pahari — Developer">
    <meta property="og:description" content="Full-stack developer focused on Django and Python. Based in Pokhara, Nepal.">
    <meta property="og:type" content="website">
    {% tailwind_css %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Smooth Scroll (Lenis) for Inertia Scrolling -->
    <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>

    <style>
        /* ── DESIGN TOKENS ─────────────────────────────────────── */
        :root {
            --bg:            #030712;
            --bg-alt:        #0b1120;
            --surface:       rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border:        rgba(255, 255, 255, 0.08);
            --border-hi:     rgba(56, 189, 248, 0.35);
            --text-1:        #f3f4f6;
            --text-2:        #9ca3af;
            --text-3:        #4b5563;
            
            --accent:        #38bdf8;
            --accent-rgb:    56, 189, 248;
            --accent-dim:    rgba(56, 189, 248, 0.12);
            --accent-glow:   rgba(56, 189, 248, 0.25);
            
            --nav-bg:        rgba(3, 7, 18, 0.75);
            --nav-border:    rgba(255, 255, 255, 0.1);
            
            /* Section-Specific Accent Colors (Dark Mode Defaults) */
            --sec-home:      56, 189, 248;   /* Sky Blue */
            --sec-about:     168, 85, 247;   /* Purple */
            --sec-projects:  16, 185, 129;   /* Emerald */
            --sec-education: 245, 158, 11;   /* Amber */
            --sec-contact:   244, 63, 94;    /* Rose */
        }

        html.light {
            --bg:            #f8fafc;
            --bg-alt:        #f1f5f9;
            --surface:       rgba(255, 255, 255, 0.7);
            --surface-hover: rgba(255, 255, 255, 0.9);
            --border:        rgba(0, 0, 0, 0.08);
            --border-hi:     rgba(2, 132, 199, 0.4);
            --text-1:        #0f172a;
            --text-2:        #475569;
            --text-3:        #94a3b8;
            
            --accent:        #0284c7;
            --accent-rgb:    2, 132, 199;
            --accent-dim:    rgba(2, 132, 199, 0.1);
            --accent-glow:   rgba(2, 132, 199, 0.2);
            
            --nav-bg:        rgba(248, 250, 252, 0.85);
            --nav-border:    rgba(0, 0, 0, 0.08);

            /* Section-Specific Accent Colors (Light Mode Tweaks) */
            --sec-home:      2, 132, 199;
            --sec-about:     147, 51, 234;
            --sec-projects:  5, 150, 105;
            --sec-education: 217, 119, 6;
            --sec-contact:   225, 29, 72;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        html {
            background: var(--bg);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-1);
            background: var(--bg);
            overflow-x: hidden;
            line-height: 1.6;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* ── TOP SCROLL MASK / SHIELD (PREVENTS NAVBAR BLEED) ──── */
        .top-scroll-shield {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 110px;
            z-index: 9990; /* Sits directly below header (z-index: 10000) */
            pointer-events: none;
            background: linear-gradient(to bottom, var(--bg) 45%, rgba(0, 0, 0, 0) 100%);
            transition: background 0.5s ease;
        }

        /* ── CUSTOM SMOOTH SCROLLBAR ────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }

        /* ── BACKGROUND CANVAS ──────────────────────────────────── */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Ambient Noise Overlay for Depth Texture */
        .bg-noise {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* ── SECTION VISUAL DIFFERENTIATION & TRANSITIONS ───────── */
        section {
            position: relative;
            z-index: 10;
            /* No base padding or min-height — each section owns its own */
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
        }

        /* Subtle Section Backdrop Separators */
        section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            pointer-events: none;
        }

        /* Section Card Base Helper Class */
        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-card:hover {
            border-color: var(--border-hi);
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -15px rgba(var(--accent-rgb), 0.15);
        }

        /* ── CUSTOM CURSOR ────────────────────────────────────── */
        @media (hover: hover) and (pointer: fine) {
            html, body, a, button, input, textarea, select, [role="button"] {
                cursor: none !important;
            }
        }
        .cur-dot {
            position: fixed; top: 0; left: 0;
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999999;
            will-change: transform;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 12px var(--accent);
            transition: width .15s, height .15s, background .15s;
        }
        .cur-ring {
            position: fixed; top: 0; left: 0;
            width: 38px; height: 38px;
            border: 1.5px solid rgba(var(--accent-rgb), 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999998;
            will-change: transform;
            transform: translate(-50%, -50%);
            display: none;
            transition: width .25s cubic-bezier(.16,1,.3,1), height .25s cubic-bezier(.16,1,.3,1), border-color .2s;
        }
        @media (hover: hover) and (pointer: fine) {
            .cur-dot  { display: block; }
            .cur-ring { display: block; }
        }
        body.cur-hover .cur-dot  { width: 14px; height: 14px; background: #ffffff; }
        body.cur-hover .cur-ring { width: 56px; height: 56px; border-color: var(--accent); background: rgba(var(--accent-rgb), 0.08); }
        body.cur-click .cur-dot  { width: 6px; height: 6px; }
        body.cur-click .cur-ring { width: 30px; height: 30px; border-color: var(--accent); }

        /* ── NAVIGATION ────────────────────────────────────────── */
        header {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 10000;
            padding: 1rem 1.5rem;
            transition: transform 0.3s ease;
        }
        @media (min-width: 1024px) { header { padding: 1.25rem 2.5rem; } }

        .nav-inner {
            max-width: 1200px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            padding: .65rem 1.25rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--nav-border);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            transition: background .3s, border-color .3s;
        }
        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -.02em;
            color: var(--text-1);
            text-decoration: none;
            display: flex; align-items: center; gap: 2px;
        }
        .nav-logo span { color: var(--accent); transition: color 0.4s ease; }
        
        .nav-links {
            display: none;
            align-items: center; gap: 2rem;
        }
        @media (min-width: 1024px) { .nav-links { display: flex; } }
        
        .nav-link {
            font-family: 'Space Grotesk', sans-serif;
            font-size: .8rem; font-weight: 600;
            letter-spacing: .08em; text-transform: uppercase;
            color: var(--text-2); text-decoration: none;
            padding: .35rem 0; position: relative;
            transition: color .25s ease;
        }
        .nav-link::after {
            content: ''; position: absolute; bottom: -2px; left: 0;
            width: 0; height: 2px;
            background: var(--accent);
            border-radius: 2px;
            transition: width .3s cubic-bezier(.16,1,.3,1);
        }
        .nav-link:hover { color: var(--text-1); }
        .nav-link:hover::after, .nav-link.active::after { width: 100%; }
        .nav-link.active { color: var(--accent); }

        .nav-right { display: flex; align-items: center; gap: 1rem; }
        .nav-social { display: none; gap: .9rem; align-items: center; }
        @media (min-width: 640px) { .nav-social { display: flex; } }
        .nav-social a {
            color: var(--text-2); font-size: 1rem; text-decoration: none;
            transition: color .2s, transform .2s;
        }
        .nav-social a:hover { color: var(--accent); transform: translateY(-2px); }

        .btn-resume {
            font-family: 'Space Grotesk', sans-serif;
            font-size: .75rem; font-weight: 600; letter-spacing: .05em;
            color: #ffffff; text-decoration: none;
            padding: .45rem 1rem; border-radius: 8px;
            background: linear-gradient(135deg, #64748b 0%, #94a3b8 100%);
            box-shadow: 0 4px 14px rgba(100, 116, 139, 0.3);
            transition: transform .2s, box-shadow .2s, background .2s;
        }
        .btn-resume:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #475569 0%, #64748b 100%);
            box-shadow: 0 6px 20px rgba(100, 116, 139, 0.4);
        }
        html.light .btn-resume {
            color: #ffffff;
            background: linear-gradient(135deg, #475569 0%, #64748b 100%);
        }
        html.light .btn-resume:hover {
            background: linear-gradient(135deg, #334155 0%, #475569 100%);
        }

        .btn-theme {
            display: inline-flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text-1); font-size: .9rem; cursor: pointer;
            transition: all .2s;
        }
        .btn-theme:hover { color: var(--accent); border-color: var(--accent); transform: rotate(12deg); }
        .btn-theme .icon-moon { display: none; }
        .btn-theme .icon-sun  { display: block; }
        html.light .btn-theme .icon-moon { display: block; }
        html.light .btn-theme .icon-sun  { display: none; }

        .nav-toggle {
            display: flex; flex-direction: column; gap: 5px;
            background: none; border: none; padding: .3rem; cursor: pointer;
        }
        @media (min-width: 1024px) { .nav-toggle { display: none; } }
        .nav-toggle span {
            display: block; width: 22px; height: 2px;
            background: var(--text-1); border-radius: 2px;
            transition: transform .3s, opacity .2s, width .25s;
        }
        .nav-open .nav-toggle span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
        .nav-open .nav-toggle span:nth-child(2) { opacity: 0; }
        .nav-open .nav-toggle span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

        .nav-mobile {
            display: none; position: absolute; top: calc(100% + .5rem); left: 0; right: 0;
            background: var(--nav-bg); backdrop-filter: blur(24px);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 1.2rem 1.5rem; flex-direction: column; gap: 1rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .nav-open .nav-mobile { display: flex; }

        /* ── PAGE CONTENT WRAPPER ──────────────────────────────── */
        .page-wrap {
            position: relative;
            z-index: 10;
        }

        /* ── BI-DIRECTIONAL SCROLL REVEAL ANIMATIONS ───────────── */
        .rv-fade, .rv-fade-up {
            opacity: 0; transform: translateY(35px);
            transition: opacity 0.7s cubic-bezier(.16,1,.3,1), transform 0.7s cubic-bezier(.16,1,.3,1);
            will-change: opacity, transform;
        }
        .rv-fade.visible, .rv-fade-up.visible { opacity: 1; transform: translateY(0); }

        .rv-scale {
            opacity: 0; transform: scale(0.94) translateY(20px);
            transition: opacity 0.7s cubic-bezier(.16,1,.3,1), transform 0.7s cubic-bezier(.16,1,.3,1);
            will-change: opacity, transform;
        }
        .rv-scale.visible { opacity: 1; transform: scale(1) translateY(0); }

        .rv-slide-left, .rv-clip {
            opacity: 0; transform: translateX(-40px);
            transition: opacity 0.7s cubic-bezier(.16,1,.3,1), transform 0.7s cubic-bezier(.16,1,.3,1);
            will-change: opacity, transform;
        }
        .rv-slide-left.visible, .rv-clip.visible { opacity: 1; transform: translateX(0); }

        .rv-slide-right, .rv-rise {
            opacity: 0; transform: translateX(40px);
            transition: opacity 0.7s cubic-bezier(.16,1,.3,1), transform 0.7s cubic-bezier(.16,1,.3,1);
            will-change: opacity, transform;
        }
        .rv-slide-right.visible, .rv-rise.visible { opacity: 1; transform: translateX(0); }

        /* Stagger delays */
        .sd-1 { transition-delay: 0.05s; }
        .sd-2 { transition-delay: 0.13s; }
        .sd-3 { transition-delay: 0.22s; }
        .sd-4 { transition-delay: 0.32s; }
        .sd-5 { transition-delay: 0.42s; }
        .sd-6 { transition-delay: 0.11s; }
        .sd-7 { transition-delay: 0.27s; }
        .sd-8 { transition-delay: 0.41s; }

        /* Respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .rv-fade, .rv-fade-up, .rv-scale,
            .rv-slide-left, .rv-clip, .rv-slide-right, .rv-rise {
                opacity: 1; transform: none;
                transition: none; animation: none;
            }
        }

        /* Scroll margin so anchor links clear the fixed nav */
        section[id] { scroll-margin-top: 80px; }
    </style>
</head>
<body data-active-section="home">

    <!-- Top Gradient Shield: Keeps elements fading out smoothly before hitting the navbar -->
    <div class="top-scroll-shield"></div>

    <!-- Ambient Animation Canvas & Texture Overlay -->
    <canvas id="bg-canvas"></canvas>
    <div class="bg-noise"></div>

    <!-- Custom Pointer Ring & Dot -->
    <div class="cur-dot" id="curDot"></div>
    <div class="cur-ring" id="curRing"></div>

    <!-- Header Navigation -->
    <header id="siteHeader">
        <nav class="nav-inner" id="navInner">
            <a href="#home" class="nav-logo">Sushant<span>.</span></a>

            <div class="nav-links">
                <a href="#home" class="nav-link active">Home</a>
                <a href="#about" class="nav-link">About</a>

            <div class="nav-right">
                <div class="nav-social">
                    <a href="https://github.com/Sushant7-codes" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                        <i class="fab fa-github"></i>
                    </a>

    <!-- Main Section Content Wrapper -->

        {% block content %}{% endblock %}

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- JAVASCRIPT ENGINE: CANVAS, SMOOTH SCROLL, SECTION SWITCHER  -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <script>
    // 1. LENIS SMOOTH SCROLL INITIALIZATION
    const lenis = new Lenis({
        duration: 1.2,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        smoothWheel: true,
        wheelMultiplier: 0.9,
        touchMultiplier: 1.5,
    });

    function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Smooth scroll for nav anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const targetId = this.getAttribute('href');
            if (targetId === '#') return;
            const targetEl = document.querySelector(targetId);
            if (targetEl) {
                lenis.scrollTo(targetEl, { offset: -60 });
            }
        });
    });

    // 2. DYNAMIC AMBIENT MESH & CONSTELLATION CANVAS ENGINE
    (function() {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const isLight = () => document.documentElement.classList.contains('light');

        let W, H, dpr;
        let mouseX = -9999, mouseY = -9999;
        let targetMouseX = -9999, targetMouseY = -9999;

        // Current Accent RGB (interpolates when switching sections)
        let currentRGB = [56, 189, 248];
        let targetRGB = [56, 189, 248];

        const SECTION_COLORS = {
            home:      [56, 189, 248],   // Cyan / Sky
            about:     [168, 85, 247],   // Purple / Violet
            projects:  [16, 185, 129],   // Emerald Green
            education: [245, 158, 11],   // Warm Amber
            contact:   [244, 63, 94]     // Coral Rose
        };

        const LIGHT_SECTION_COLORS = {
            home:      [2, 132, 199],
            about:     [147, 51, 234],
            projects:  [5, 150, 105],
            education: [217, 119, 6],
            contact:   [225, 29, 72]
        };

        // Particles & Mesh Orbs
        let particles = [];
        let orbs = [];

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(dpr, dpr);
            initElements();
        }

        function initElements() {
            particles = [];
            orbs = [];

            // Floating Background Orbs for dynamic ambient gradients
            const orbCount = 3;
            for (let i = 0; i < orbCount; i++) {
                orbs.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    radius: Math.random() * 200 + 180,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    phase: Math.random() * Math.PI * 2
                });
            }

            // Interactive Constellation Particles
            const particleCount = Math.floor((W * H) / 18000);
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    radius: Math.random() * 1.5 + 1,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }
        }

        window.addEventListener('mousemove', e => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            targetMouseX = -9999;
            targetMouseY = -9999;
        });

        window.addEventListener('resize', resize);
        resize();

        // Color Interpolation Function (Smooth transitions between section colors)
        function lerpColor() {
            currentRGB[0] += (targetRGB[0] - currentRGB[0]) * 0.04;
            currentRGB[1] += (targetRGB[1] - currentRGB[1]) * 0.04;
            currentRGB[2] += (targetRGB[2] - currentRGB[2]) * 0.04;

            const rgbStr = `${Math.round(currentRGB[0])}, ${Math.round(currentRGB[1])}, ${Math.round(currentRGB[2])}`;
            document.documentElement.style.setProperty('--accent-rgb', rgbStr);
            document.documentElement.style.setProperty('--accent', `rgb(${rgbStr})`);
        }

        window.updateCanvasTheme = function(sectionId) {
            const palette = isLight() ? LIGHT_SECTION_COLORS : SECTION_COLORS;
            if (palette[sectionId]) {
                targetRGB = palette[sectionId];
            }
        };

        function drawFrame() {
            // Smooth mouse dampening
            mouseX += (targetMouseX - mouseX) * 0.08;
            mouseY += (targetMouseY - mouseY) * 0.08;

            lerpColor();

            ctx.clearRect(0, 0, W, H);

            const r = Math.round(currentRGB[0]);
            const g = Math.round(currentRGB[1]);
            const b = Math.round(currentRGB[2]);

            // 1. DRAW AMBIENT MESH GLOW ORBS
            orbs.forEach((orb, i) => {
                orb.x += orb.vx;
                orb.y += orb.vy;

                if (orb.x < -100) orb.x = W + 100;
                if (orb.x > W + 100) orb.x = -100;
                if (orb.y < -100) orb.y = H + 100;
                if (orb.y > H + 100) orb.y = -100;

                const grad = ctx.createRadialGradient(orb.x, orb.y, 10, orb.x, orb.y, orb.radius);
                const alpha = isLight() ? 0.08 : 0.06;
                grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
                grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

                ctx.beginPath();
                ctx.fillStyle = grad;
                ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. DRAW CONSTELLATION PARTICLES & MESH EDGES
            const connectDist = 120;
            const mouseDist = 150;

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];

                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > W) p.vx *= -1;
                if (p.y < 0 || p.y > H) p.vy *= -1;

                // Mouse Repulsion / Interactive Wave
                const dx = p.x - mouseX;
                const dy = p.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < mouseDist) {
                    const force = (1 - dist / mouseDist) * 12;
                    p.x += (dx / dist) * force * 0.2;
                    p.y += (dy / dist) * force * 0.2;
                }

                // Render Particle Dot
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                const dotAlpha = isLight() ? p.alpha * 0.6 : p.alpha;
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${dotAlpha})`;
                ctx.fill();

                // Connect Nearby Particles
                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    const pdx = p.x - p2.x;
                    const pdy = p.y - p2.y;
                    const pDist = Math.sqrt(pdx * pdx + pdy * pdy);

                    if (pDist < connectDist) {
                        const edgeAlpha = (1 - pDist / connectDist) * (isLight() ? 0.12 : 0.08);
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${edgeAlpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(drawFrame);
        }

        drawFrame();
    })();

    // 3. INTERSECTION OBSERVERS (ACTIVE SECTION & BI-DIRECTIONAL ANIMATION REVEAL)
    (function() {
        const sections = document.querySelectorAll('section[id]');
        const navLinks = document.querySelectorAll('.nav-link');

        // Section Accent Switcher
        const sectionObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id;
                    document.body.setAttribute('data-active-section', id);

                    navLinks.forEach(link => {
                        link.classList.toggle('active', link.getAttribute('href') === `#${id}`);
                    });

                    if (window.updateCanvasTheme) {
                        window.updateCanvasTheme(id);
                    }
                }
            });
        }, { rootMargin: '-40% 0px -40% 0px', threshold: 0 });

        sections.forEach(sec => sectionObserver.observe(sec));

        // BI-DIRECTIONAL SCROLL REVEAL OBSERVER
        // Adds 'visible' class when scrolling into viewport, removes it when scrolling out
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                } else {
                    entry.target.classList.remove('visible');
                }
            });
        }, { 
            threshold: 0.12,
            rootMargin: '-50px 0px -50px 0px' 
        });

        document.querySelectorAll('.rv-fade, .rv-scale, .rv-slide-left, .rv-slide-right').forEach(el => {
            revealObserver.observe(el);
        });
    })();

    // 4. CUSTOM CURSOR TRAIL ENGINE
    (function() {
        const dot = document.getElementById('curDot');
        const ring = document.getElementById('curRing');
        if (!dot || !ring) return;

        let mx = -200, my = -200, rx = -200, ry = -200;

        window.addEventListener('mousemove', e => {
            mx = e.clientX; my = e.clientY;
            dot.style.transform = `translate3d(${mx}px,${my}px,0) translate(-50%,-50%)`;
        });

        const bindHover = () => {
            document.querySelectorAll('a, button, input, textarea, select, [role="button"]').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('cur-hover'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('cur-hover'));
            });
        };
        bindHover();
        new MutationObserver(bindHover).observe(document.body, { childList: true, subtree: true });

        document.addEventListener('mousedown', () => document.body.classList.add('cur-click'));
        document.addEventListener('mouseup', () => document.body.classList.remove('cur-click'));

        function ringLoop() {
            rx += (mx - rx) * 0.15;
            ry += (my - ry) * 0.15;
            ring.style.transform = `translate3d(${rx}px,${ry}px,0) translate(-50%,-50%)`;
            requestAnimationFrame(ringLoop);
        }
        ringLoop();
    })();

    // 5. THEME TOGGLE & NAV TOGGLE LOGIC
    (function() {
        const html = document.documentElement;
        const KEY = 'sp-theme';

        function applyTheme(t) {
            if (t === 'light') html.classList.add('light');
            else html.classList.remove('light');

            const activeSec = document.body.getAttribute('data-active-section') || 'home';
            if (window.updateCanvasTheme) window.updateCanvasTheme(activeSec);
        }

        applyTheme(localStorage.getItem(KEY) || 'dark');

        document.getElementById('themeToggle').addEventListener('click', () => {
            const next = html.classList.contains('light') ? 'dark' : 'light';
            applyTheme(next);
            localStorage.setItem(KEY, next);
        });

        // Mobile Nav Toggle
        const toggle = document.getElementById('navToggle');
        const navInner = document.getElementById('navInner');
        toggle.addEventListener('click', () => navInner.classList.toggle('nav-open'));
        document.querySelectorAll('.mob-link').forEach(l => {
            l.addEventListener('click', () => navInner.classList.remove('nav-open'));
        });
    })();
    </script>
</body>

{% load static tailwind_tags %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sushant Pahari | Portfolio{% endblock %}</title>
    {% tailwind_css %}
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>

        :root {
            --bg-base: #030712;
            --primary-glow: #1d4ed8;   
            --secondary-glow: #3b82f6; 
            --tertiary-glow: #ffffff;  
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-surface: rgba(3, 7, 18, 0.55);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            scroll-snap-type: y proximity;
            background-color: var(--bg-base);
            overflow-x: hidden;
        }

        @media (hover: hover) and (pointer: fine) {
            html, body, a, button, input, textarea, i, [role="button"], .signature-btn, .nexus-item { 
                cursor: none !important; 
            }
            .cursor-dot, .cursor-halo { display: block; }
        }

        @media (hover: none) or (pointer: coarse) {
            .cursor-dot, .cursor-halo { display: none; }
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
            overflow-x: hidden;
            background: var(--bg-base);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, var(--primary-glow), var(--secondary-glow), var(--tertiary-glow));
            border-radius: 10px;
        }

        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
            pointer-events: none !important;
            z-index: 100005;
            will-change: transform;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            display: none;
        }

        .cursor-halo {
            position: fixed;
            top: 0;
            left: 0;
            width: 46px;
            height: 46px;
            border: 1.5px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            pointer-events: none !important;
            z-index: 100004;
            will-change: transform;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        height 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
        }

        body.interactive-engaged .cursor-halo {
            width: 74px;
            height: 74px;
            background-color: rgba(255, 255, 255, 1);
            border-color: transparent;
            mix-blend-mode: difference;
        }

        body.interactive-engaged .cursor-dot {
            opacity: 0;
        }

        #fluid-matrix-backplane {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .vector-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.008) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.008) 1px, transparent 1px);
            background-size: 80px 80px;
            pointer-events: none;
            mask-image: radial-gradient(circle at var(--raw-x, 50%) var(--raw-y, 50%), black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at var(--raw-x, 50%) var(--raw-y, 50%), black 30%, transparent 75%);
        }

        header {
            position: fixed;
            top: 1rem;
            left: 0;
            right: 0;
            z-index: 10000;
            padding: 0 1rem;
            display: flex;
            justify-content: center;
        }

        @media (min-width: 1024px) {
            header { top: 2rem; padding: 0 2rem; }
        }

        .navigation-vault {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            padding: 0.75rem 1.5rem;
            background: var(--glass-surface);
            backdrop-filter: blur(35px) saturate(180%);
            -webkit-backdrop-filter: blur(35px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            position: relative;
        }

        #navbar-glow-line{
            position:absolute;
            bottom:14px;
            left:0;
            height:2px;
            width:0;
            opacity:0;
            background:#38bdf8;
            border-radius:999px;
            box-shadow:
            0 0 8px #38bdf8,
            0 0 18px rgba(56,189,248,.7);
            transition:
            left .35s ease,
            width .35s ease,
            opacity .25s ease;
            will-change:left,width;
        }

        @media (max-width:1023px){
            #navbar-glow-line{
            opacity:0;
            pointer-events:none;
            }
        }

        @media (min-width: 1024px) {
            #navbar-glow-line {
                display: block;
            }
        }

        .links-nexus {
            display: flex;
            align-items: center;
            gap: 2.25rem;
        }

        .utility-cluster {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-shrink: 0;
        }

        .social-vault {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            flex-shrink: 0;
        }

        .logo-mark {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 4px;
            text-decoration: none;
            z-index: 101;
            display: inline-flex;
            flex-shrink: 0;
        }

        @media (min-width: 1024px) {
            .logo-mark { font-size: 1.6rem; letter-spacing: 5px; }
        }

        .logo-mark .char-s {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .logo-mark .char-p {
            background: linear-gradient(135deg, var(--secondary-glow), #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nexus-item {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            position: relative;
            transition: color 0.4s ease;
            padding: 0.6rem 0;
            flex-shrink: 0;
        }

        .nexus-item.active-nav{color:#ffffff;}

        .nexus-item:hover { color: #fff; }

        .nexus-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--secondary-glow), #fff);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nexus-item:hover::after {
            width: 100%;
            left: 0;
        }

        .social-vault a {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.25rem;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .social-vault a:hover {
            color: #fff;
            transform: translateY(-3px) scale(1.1);
        }

        .signature-btn {
            position: relative;
            background: #fff;
            color: var(--bg-base);
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            overflow: hidden;
            border: 1px solid #fff;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
            flex-shrink: 0;
        }

        .signature-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .signature-btn:hover {
            color: #fff;
            border-color: transparent;
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .signature-btn:hover::before { opacity: 1; }

        .kinetic-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 16px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 101;
            padding: 0;
            flex-shrink: 0;
        }

        .kinetic-toggle span {
            width: 100%;
            height: 2px;
            background-color: #ffffff;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.3s ease, 
                        width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: right center;
        }

        .kinetic-toggle span:nth-child(2) { width: 75%; }

        .menu-active .kinetic-toggle span:nth-child(1) {
            transform: rotate(-45deg) translate(-2px, 0px);
            width: 22px;
        }

        .menu-active .kinetic-toggle span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        .menu-active .kinetic-toggle span:nth-child(3) {
            transform: rotate(45deg) translate(-2px, 0px);
            width: 22px;
        }

        .responsive-matrix {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 0.75rem;
            background: rgba(3, 7, 18, 0.96);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            opacity: 0;
            transform: translateY(-10px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            z-index: 999;
        }

        .menu-active .responsive-matrix {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .responsive-matrix .nexus-item {
            font-size: 1.1rem;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 0.2rem 0;
        }

        .menu-active .responsive-matrix .nexus-item {
            opacity: 1;
            transform: translateY(0);
        }

        .menu-active .responsive-matrix .nexus-item:nth-child(1) { transition-delay: 0.05s; }
        .menu-active .responsive-matrix .nexus-item:nth-child(2) { transition-delay: 0.10s; }
        .menu-active .responsive-matrix .nexus-item:nth-child(3) { transition-delay: 0.15s; }
        .menu-active .responsive-matrix .nexus-item:nth-child(4) { transition-delay: 0.20s; }
        .menu-active .responsive-matrix .nexus-item:nth-child(5) { transition-delay: 0.25s; }

        @media (max-width: 1023px) {
            .links-nexus {
                display: none !important;
            }
            .kinetic-toggle {
                display: flex !important;
            }
        }

        @media (min-width: 1024px) {
            .links-nexus {
                display: flex !important;
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
            }
            .kinetic-toggle {
                display: none !important;
            }
            .responsive-matrix {
                display: none !important;
            }
        }

        #kineticCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100003;
            pointer-events: none !important;
        }

        .viewport-layer {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            padding-top: 6.5rem;
        }

        @media (min-width: 1024px) {
            .viewport-layer { padding-top: 8.5rem; }
        }

        #mobile-indicator{
            position:absolute;
            left:0;
            top:0;
            width:3px;
            height:30px;
            border-radius:20px;
            background:#38bdf8;
            box-shadow:
            0 0 10px #38bdf8;
            transition:
            top .35s ease,
            height .35s ease;
        }

        /* ========== FADE LENSES (replaces blur) ========== */
        .scroll-fade-lens {
            position: fixed;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 9999;
            pointer-events: none;
        }

        .top-lens {
            top: 0;
            height: 160px;
            background: linear-gradient(
                to bottom,
                rgba(3, 7, 18, 1)    0%,
                rgba(3, 7, 18, 0.9)  20%,
                rgba(3, 7, 18, 0.6)  45%,
                rgba(3, 7, 18, 0.25) 70%,
                rgba(3, 7, 18, 0)    100%
            );
        }

        .bottom-lens {
            bottom: 0;
            height: 200px;
            background: linear-gradient(
                to top,
                rgba(3, 7, 18, 1)    0%,
                rgba(3, 7, 18, 0.95) 15%,
                rgba(3, 7, 18, 0.8)  30%,
                rgba(3, 7, 18, 0.55) 50%,
                rgba(3, 7, 18, 0.3)  70%,
                rgba(3, 7, 18, 0.12) 85%,
                rgba(3, 7, 18, 0)    100%
            );
        }

        #home,
        #education,
        #projects,
        #contact{
            scroll-margin-top:90px;
        }

        #about{
            scroll-margin-top:20px;
        }
    </style>
</head>
<body>

    <div class="scroll-fade-lens top-lens"></div>
    <div class="scroll-fade-lens bottom-lens"></div>

    <div id="fluid-matrix-backplane"></div>
    <canvas id="kineticCanvas"></canvas>

    <div class="cursor-dot" id="dotNode"></div>
    <div class="cursor-halo" id="haloNode"></div>
    <div class="vector-overlay" id="vectorNode"></div>

    <header id="headerContainer">
        <nav class="navigation-vault">
            
            <a href="#home" class="logo-mark">
                <span class="char-s">S</span><span class="char-p">P</span>
            </a>

            <div class="links-nexus">
                <a href="#home" class="nexus-item">Home</a>
                <a href="#about" class="nexus-item">About</a>
                <a href="#projects" class="nexus-item">Projects</a>
                <a href="#education" class="nexus-item">Education</a>
                <a href="#contact" class="nexus-item">Contact</a>
            </div>

            <div class="utility-cluster">
                <div class="social-vault">
                    <a href="https://github.com/Sushant7-codes" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fab fa-github"></i></a>
                    <a href="https://www.linkedin.com/in/sushant-pahari-19705b371/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                </div>
                
                <a href="{% static 'files/sushantpaharicv.pdf' %}"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="signature-btn">
                    <span>Resume</span>
                    <i class="fas fa-arrow-right text-xs hidden sm:inline-block"></i>
                </a>

                <button class="kinetic-toggle" id="menuTrigger" aria-label="Toggle Navigation Stack">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>

            <div class="responsive-matrix">
                <div id="mobile-indicator"></div>
                <a href="#home" class="nexus-item mobile-link">Home</a>
                <a href="#about" class="nexus-item mobile-link">About</a>
                <a href="#projects" class="nexus-item mobile-link">Projects</a>
                <a href="#education" class="nexus-item mobile-link">Education</a>
                <a href="#contact" class="nexus-item mobile-link">Contact</a>
            </div>
        </nav>
    </header>

    <div class="viewport-layer">
        {% block content %}
        {% endblock content %}
    </div>

    <script>
        const dot = document.getElementById('dotNode');
        const halo = document.getElementById('haloNode');
        const vector = document.getElementById('vectorNode');
        const canvas = document.getElementById('kineticCanvas');
        const ctx = canvas.getContext('2d');
        const backplane = document.getElementById('fluid-matrix-backplane');
        const headerContainer = document.getElementById('headerContainer');
        const menuTrigger = document.getElementById('menuTrigger');
        const mobileLinks = document.querySelectorAll('.mobile-link');
        const mobileIndicator = document.getElementById("mobile-indicator");

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let haloX = mouseX;
        let haloY = mouseY;
        
        let targetRadius = 0;
        let currentRadius = 0;

        let rawX = 0.5;
        let rawY = 0.5;
        let smoothX = 0.5;
        let smoothY = 0.5;

        const ribbonPoints = [];
        const maxRibbonPoints = 25;

        menuTrigger.addEventListener('click', () => {
            headerContainer.classList.toggle('menu-active');
        });

        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                headerContainer.classList.remove('menu-active');
            });
        });

        window.addEventListener('resize', () => {
            adjustResolution();
            if (window.innerWidth >= 1024) {
                headerContainer.classList.remove('menu-active');
            }
        });

        function adjustResolution() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        adjustResolution();

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            rawX = e.clientX / window.innerWidth;
            rawY = 1.0 - (e.clientY / window.innerHeight);

            dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;

            const pctX = (mouseX / window.innerWidth) * 100;
            const pctY = (mouseY / window.innerHeight) * 100;
            vector.style.setProperty('--raw-x', `${pctX}%`);
            vector.style.setProperty('--raw-y', `${pctY}%`);

            ribbonPoints.push({ x: mouseX, y: mouseY });
            if (ribbonPoints.length > maxRibbonPoints) {
                ribbonPoints.shift();
            }
        });

        const syncInteractions = () => {
            const targets = document.querySelectorAll('a, button, input, textarea, i, [role="button"]');
            targets.forEach(node => {
                node.addEventListener('mouseenter', () => {
                    document.body.classList.add('interactive-engaged');
                    targetRadius = 35;
                });
                node.addEventListener('mouseleave', () => {
                    document.body.classList.remove('interactive-engaged');
                    targetRadius = 0;
                });
            });
        };
        syncInteractions();

        const observer = new MutationObserver(syncInteractions);
        observer.observe(document.body, { childList: true, subtree: true });

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        backplane.appendChild(renderer.domElement);

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float u_time;
            uniform vec2 u_mouse;
            uniform vec2 u_resolution;
            varying vec2 vUv;

            vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }

            float snoise(vec2 v){
                const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                                -0.577350269189626, 0.024390243902439);
                vec2 i  = floor(v + dot(v, C.yy) );
                vec2 x0 = v -   i + dot(i, C.xx);
                vec2 i1;
                i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec4 x12 = x0.xyxy + C.xxzz;
                x12.xy -= i1;
                i = mod(i, 289.0);
                vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
                + i.x + vec3(0.0, i1.x, 1.0 ));
                vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
                                    dot(x12.zw,x12.zw)), 0.0);
                m = m*m ;
                m = m*m ;
                vec3 x = 2.0 * fract(p * C.www) - 1.0;
                vec3 h = abs(x) - 0.5;
                vec3 a0 = x - floor(x + 0.5);
                vec3 myOpacity = 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                vec3 g;
                g.x  = a0.x  * x0.x  + h.x  * x0.y;
                g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                return 130.0 * dot(m, g);
            }

            void main() {
                vec2 st = gl_FragCoord.xy / u_resolution.xy;
                vec2 noiseUv = vUv * 1.3;
                
                float n1 = snoise(noiseUv + vec2(u_time * 0.015, u_time * 0.01));
                float n2 = snoise(noiseUv - vec2(u_time * 0.02, -u_time * 0.008) + u_mouse * 0.2);
                
                vec2 distortedUv = vUv + vec2(n1, n2) * 0.15;
                
                float d1 = distance(distortedUv, u_mouse);
                float d2 = distance(distortedUv, vec2(0.1, 0.9));
                float d3 = distance(distortedUv, vec2(0.8, 0.2));
                
                float m1 = smoothstep(0.7, 0.0, d1);
                float m2 = smoothstep(0.9, 0.0, d2);
                float m3 = smoothstep(0.6, 0.0, d3);
                
                vec3 c_deepNavy = vec3(0.01, 0.04, 0.18);
                vec3 c_electricBlue = vec3(0.02, 0.18, 0.45);
                vec3 c_starkWhite = vec3(0.65, 0.75, 0.9); 
                vec3 c_base = vec3(0.01, 0.02, 0.06);
                
                vec3 finalColor = c_base;
                finalColor = mix(finalColor, c_deepNavy, m2 * 0.7);
                finalColor = mix(finalColor, c_electricBlue, m3 * 0.6);
                finalColor = mix(finalColor, c_starkWhite, m1 * 0.35);
                
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const uniforms = {
            u_time: { value: 0 },
            u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms,
            depthWrite: false,
            depthTest: false
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function engineLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            haloX += (mouseX - haloX) * 0.18;
            haloY += (mouseY - haloY) * 0.18;
            halo.style.transform = `translate3d(${haloX}px, ${haloY}px, 0) translate(-50%, -50%)`;

            currentRadius += (targetRadius - currentRadius) * 0.15;

            smoothX += (rawX - smoothX) * 0.05;
            smoothY += (rawY - smoothY) * 0.05;
            uniforms.u_mouse.value.set(smoothX, smoothY);
            uniforms.u_time.value = clock.getElapsedTime();

            renderer.render(scene, camera);

            ctx.beginPath();
            ctx.arc(haloX, haloY, 5 + currentRadius * 0.15, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.shadowColor = '#60a5fa';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;

            if (ribbonPoints.length > 1) {
                ctx.shadowBlur = 25;
                
                for (let i = 1; i < ribbonPoints.length; i++) {
                    const p1 = ribbonPoints[i - 1];
                    const p2 = ribbonPoints[i];
                    const ratio = i / ribbonPoints.length;

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);

                    const grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
                    grad.addColorStop(0, `rgba(29, 78, 216, ${ratio * 0.6})`);
                    grad.addColorStop(0.5, `rgba(59, 130, 246, ${ratio * 0.8})`);
                    grad.addColorStop(1, `rgba(255, 255, 255, ${ratio * 0.7})`);

                    ctx.strokeStyle = grad;
                    ctx.lineWidth = ratio * (8 + currentRadius * 0.3);
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.shadowColor = '#3b82f6';
                    ctx.stroke();
                }

                ctx.shadowBlur = 0;
            }

            if (ribbonPoints.length > 0 && Math.random() > 0.3) {
                ribbonPoints.shift();
            }

            requestAnimationFrame(engineLoop);
        }
        requestAnimationFrame(engineLoop);

    </script>
